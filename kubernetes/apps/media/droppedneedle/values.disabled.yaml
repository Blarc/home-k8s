app-template:
  controllers:
    droppedneedle:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        app:
          image:
            repository: docker.io/droppedneedle/droppedneedle
            tag: latest@sha256:6d58d829cc5aa29e5de95933ba1ce46f249ccf7ef3ed437c643231b771d711c5
          env:
            PORT: &containerPort 8688
            TZ: Europe/Ljubljana
            UMASK: "002"
            SLSKD_DOWNLOADS_PATH: /media/slskd/complete
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: *containerPort
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: *containerPort
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 2Gi
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
  service:
    app:
      ports:
        http:
          port: &port 80
          targetPort: *containerPort
  route:
    app:
      hostnames:
        - "{{ .Release.Name }}.blarc.my.id"
      parentRefs:
        - name: internal
          namespace: traefik
      rules:
        - backendRefs:
            - identifier: app
              port: *port
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      type: persistentVolumeClaim
      storageClass: topolvm-thin-retain
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /app/config
    cache:
      type: persistentVolumeClaim
      storageClass: topolvm-thin
      accessMode: ReadWriteOnce
      size: 5Gi
      globalMounts:
        - path: /app/cache
    plugins:
      type: persistentVolumeClaim
      storageClass: topolvm-thin
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /app/plugins
    imports:
      type: persistentVolumeClaim
      storageClass: topolvm-thin
      accessMode: ReadWriteOnce
      size: 5Gi
      globalMounts:
        - path: /app/imports
    media:
      existingClaim: qbittorrent-media
      globalMounts:
        - path: /media
    tmp:
      type: emptyDir
