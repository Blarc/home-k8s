app-template:
  controllers:
    jellyfin:
      annotations:
        reloader.stakater.com/auto: "true"
      initContainers:
        enable-metrics:
          image:
            repository: ghcr.io/jellyfin/jellyfin
            tag: 10.11.11
          command:
            - /bin/sh
            - -ec
            - |
              config=/config/config/system.xml
              if [ -f "$config" ] && grep -q '<EnableMetrics>' "$config"; then
                sed -i 's#<EnableMetrics>false</EnableMetrics>#<EnableMetrics>true</EnableMetrics>#' "$config"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
      containers:
        app:
          image:
            repository: ghcr.io/jellyfin/jellyfin
            tag: 10.11.11
          env:
            JELLYFIN_PublishedServerUrl: "https://{{ .Release.Name }}.blarc.my.id"
            TZ: Europe/Ljubljana
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: &containerPort 8096
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5
            readiness: *probes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
              gpu.intel.com/i915: 1
            limits:
              memory: 4Gi
              gpu.intel.com/i915: 1
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
  service:
    app:
      ports:
        http:
          port: &port 80
          targetPort: *containerPort
  route:
    app:
      hostnames:
        - "{{ .Release.Name }}.blarc.my.id"
      parentRefs:
        - name: external
          namespace: traefik
      rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                path:
                  type: ReplaceFullPath
                  replaceFullPath: /
                statusCode: 302
          matches:
            - path:
                type: Exact
                value: /metrics
        - backendRefs:
            - identifier: app
              port: *port
          matches:
            - path:
                type: PathPrefix
                value: /
  serviceMonitor:
    app:
      endpoints:
        - port: http
          interval: 30s
          path: /metrics
          scheme: http
          scrapeTimeout: 30s
  persistence:
    config:
      type: persistentVolumeClaim
      storageClass: topolvm-thin-retain
      accessMode: ReadWriteOnce
      size: 3Gi
    cache:
      type: persistentVolumeClaim
      storageClass: topolvm-thin
      accessMode: ReadWriteOnce
      size: 10Gi
    media:
      existingClaim: qbittorrent-media
      globalMounts:
        - path: /media
          readOnly: true
    tmp:
      type: emptyDir
