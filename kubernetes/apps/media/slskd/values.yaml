app-template:
  controllers:
    slskd:
      annotations:
        reloader.stakater.com/auto: "true"
      initContainers:
        prepare-directories:
          image: &image
            repository: docker.io/slskd/slskd
            tag: latest@sha256:d0963a3e5b16facd295bf4f2156dad0182f246b1b21a032cae12f5494c694843
          command:
            - /bin/sh
            - -c
            - umask 002; mkdir -p /media/music /media/slskd/complete /media/slskd/incomplete
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
      containers:
        app:
          image: *image
          # Enforce proxy authentication even if slskd.yml changes.
          args: ["./slskd", "--no-auth"]
          env:
            TZ: Europe/Ljubljana
            SLSKD_UMASK: "002"
            SLSKD_REMOTE_CONFIGURATION: "true"
            SLSKD_NO_HTTPS: "true"
            SLSKD_HTTP_PORT: &containerPort 5030
            SLSKD_SLSK_LISTEN_PORT: &peerPort 50300
            SLSKD_DOWNLOADS_DIR: /media/slskd/complete
            SLSKD_INCOMPLETE_DIR: /media/slskd/incomplete
            SLSKD_SHARED_DIR: /media/music
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: *containerPort
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: *containerPort
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 2Gi
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
  service:
    app:
      forceRename: "{{ .Release.Name }}"
      primary: true
      ports:
        http:
          port: &port 80
          targetPort: *containerPort
    soulseek:
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "192.168.1.230"
      externalTrafficPolicy: Local
      ports:
        soulseek:
          port: *peerPort
          protocol: TCP
  route:
    app:
      hostnames:
        - "{{ .Release.Name }}.blarc.my.id"
      annotations:
        # Create the backend Service before checking route health.
        argocd.argoproj.io/sync-wave: "1"
      parentRefs:
        - name: internal
          namespace: traefik
      rules:
        - filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: "{{ .Release.Name }}-authelia-forward-auth"
          backendRefs:
            - identifier: app
              port: *port
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    config:
      type: persistentVolumeClaim
      storageClass: topolvm-thin-retain
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /app
    media:
      existingClaim: qbittorrent-media
      globalMounts:
        - path: /media
    tmp:
      type: emptyDir
