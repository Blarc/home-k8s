authelia:
  enabled: true

  image:
    tag: 4.39.20

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    gatewayAPI:
      enabled: true
      hostnamesOverride:
        - auth.blarc.my.id
      parentRefs:
        - name: external
          namespace: traefik

  pod:
    kind: Deployment
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    securityContext:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      pod:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

  persistence:
    enabled: true
    storageClass: topolvm-thin-retain
    accessModes:
      - ReadWriteOnce
    size: 512Mi

  configMap:
    log:
      level: warn
      format: text
    telemetry:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
    theme: light
    totp:
      issuer: Blarc
    authentication_backend:
      ldap:
        enabled: true
        implementation: lldap
        address: ldap://lldap.auth.svc.cluster.local:389
        base_dn: DC=blarc,DC=my,DC=id
        user: uid=authelia_bind,ou=people,DC=blarc,DC=my,DC=id
    access_control:
      default_policy: one_factor
    session:
      same_site: lax
      expiration: 12 hours
      inactivity: 1 hour
      remember_me: 1 month
      cookies:
        - domain: blarc.my.id
          subdomain: auth
      redis:
        enabled: true
        host: authelia-valkey.auth.svc.cluster.local
        port: 6379
    storage:
      local:
        enabled: true
        path: /config/db.sqlite3
    notifier:
      smtp:
        enabled: true
        address: submissions://mail.blarc.my.id:465
        sender: "Blarc Auth <noreply@blarc.my.id>"
        identifier: auth.blarc.my.id
        subject: "[Blarc Auth] {title}"
        startup_check_address: noreply@blarc.my.id
        username: noreply@blarc.my.id
    identity_providers:
      oidc:
        enabled: true
        enforce_pkce: public_clients_only
        lifespans:
          access_token: 5 minutes
          refresh_token: 30 days
          id_token: 1 hour
          authorize_code: 1 minute
        cors:
          endpoints:
            - token
            - userinfo
          allowed_origins_from_client_redirect_uris: true
        claims_policies:
          headscale:
            id_token:
              - email
              - email_verified
              - groups
              - name
              - preferred_username
          netbird:
            id_token:
              - email
              - name
              - preferred_username
          sftpgo:
            id_token:
              - preferred_username
        authorization_policies:
          headscale:
            default_policy: deny
            rules:
              - policy: one_factor
                subject:
                  - group:Headscale
        jwks:
          - key_id: authelia-rs256
            algorithm: RS256
            use: sig
            key:
              path: /secrets/oidc/jwks.rs256.key
        clients:
          - client_id: hrQQXJ6Vf93NhcmSR1EpZ8Oa3PMala9t9fUY0cq8
            client_name: Immich
            client_secret:
              path: /secrets/oidc/immich.client_secret
            authorization_policy: one_factor
            consent_mode: implicit
            token_endpoint_auth_method: client_secret_post
            redirect_uris:
              - app.immich:///oauth-callback
              - https://immich.blarc.my.id/auth/login
              - https://immich.blarc.my.id/user-settings
            scopes: &defaultScopes
              - openid
              - profile
              - email
              - groups
          - client_id: 9n6ONr1PMtsmXgvGmFe3Cj4lLxcGHmniyOXPHea6
            client_name: Paperless NGX
            client_secret:
              path: /secrets/oidc/paperless-ngx.client_secret
            authorization_policy: one_factor
            consent_mode: implicit
            redirect_uris:
              - https://paperless.blarc.my.id/accounts/oidc/authelia/login/callback/
            scopes: *defaultScopes
          - client_id: WCGMVybLFybqomkRu0SR7zqaC22uFNSnFLOsNxRV
            client_name: NetBird
            client_secret:
              path: /secrets/oidc/netbird.client_secret
            authorization_policy: one_factor
            claims_policy: netbird
            consent_mode: explicit
            token_endpoint_auth_method: client_secret_post
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://netbird.blarc.my.id/peers
              - https://netbird.blarc.my.id/add-peers
              - https://netbird.blarc.my.id/callback
              - https://netbird.blarc.my.id/silent-callback
              - http://localhost:53000
              - http://localhost:54000
            scopes:
              - openid
              - profile
              - email
              - groups
              - offline_access
            grant_types:
              - authorization_code
              - refresh_token
          - client_id: PgNSBVNX30wv2vQbv0ctf47cTejs2OZNeCRUU8mB
            client_name: Grafana
            client_secret:
              path: /secrets/oidc/grafana.client_secret
            authorization_policy: one_factor
            consent_mode: implicit
            redirect_uris:
              - https://grafana.blarc.my.id/login/generic_oauth
            scopes: *defaultScopes
          - client_id: VSCyzulJkDpwFk1o01Y570XxupFnFOtL1UMPDTHD
            client_name: Audiobookshelf
            client_secret:
              path: /secrets/oidc/audiobookshelf.client_secret
            authorization_policy: one_factor
            consent_mode: implicit
            redirect_uris:
              - https://audiobookshelf.blarc.my.id/auth/openid/callback
              - https://audiobookshelf.blarc.my.id/auth/openid/mobile-redirect
            scopes: *defaultScopes
          - client_id: jXKouhMMPFCVzc0ZEp196vVV3zaVa2CMDHaBFQrF
            client_name: SFTPGo
            client_secret:
              path: /secrets/oidc/sftpgo.client_secret
            authorization_policy: one_factor
            claims_policy: sftpgo
            consent_mode: implicit
            redirect_uris:
              - https://sftpgo.blarc.my.id/web/oidc/redirect
            scopes:
              - openid
              - profile
              - email
              - groups
              - offline_access
            grant_types:
              - authorization_code
              - refresh_token
          - client_id: WMkTDUQ4ZdKotqQuTclpCw5ofhZ3bWALaH5N3MFs
            client_name: Headscale
            client_secret:
              path: /secrets/oidc/headscale.client_secret
            authorization_policy: headscale
            claims_policy: headscale
            consent_mode: implicit
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://headscale.blarc.my.id/oidc/callback
            scopes: *defaultScopes

  secret:
    additionalSecrets:
      authelia-oidc:
        path: oidc

app-template:
  global:
    alwaysAppendIdentifierToResourceName: true

  controllers:
    valkey:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        app:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.1.2-alpine
          command:
            - /bin/sh
            - -ec
            - exec valkey-server --save "" --appendonly no --requirepass "$VALKEY_PASSWORD"
          envFrom:
            - secretRef:
                identifier: valkey
          ports:
            - name: redis
              containerPort: &valkeyPort 6379
          probes:
            liveness: &valkeyProbe
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: redis
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 5
            readiness: *valkeyProbe
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

  service:
    valkey:
      forceRename: authelia-valkey
      controller: valkey
      ports:
        redis:
          port: 6379
          targetPort: *valkeyPort

  persistence:
    data:
      type: emptyDir
      advancedMounts:
        valkey:
          app:
            - path: /data
