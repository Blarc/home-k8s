apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-dufs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  parentRefs:
    - name: internal
      namespace: traefik
  hostnames:
    - nas.blarc.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia-forward-auth
      backendRefs:
        - name: {{ .Release.Name }}-dufs
          port: 5000
