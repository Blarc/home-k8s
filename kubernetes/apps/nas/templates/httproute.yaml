apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-dufs
spec:
  parentRefs:
    - name: internal
      namespace: traefik
  hostnames:
    - nas.blarc.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-dufs
          port: 5000