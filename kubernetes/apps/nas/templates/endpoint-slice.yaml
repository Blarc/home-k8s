# Manually applied, because argo-cd has it excluded
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nas-dufs
  labels:
    kubernetes.io/service-name: nas-dufs
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 5000
endpoints:
  - addresses:
      - 192.168.1.13
    conditions:
      ready: true