apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: kubernetes.io/basic-auth
stringData:
  username: "securo"
  password: {{ required "secret.databasePassword is required; load values.encrypted.yaml" .Values.secret.databasePassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  SECRET_KEY: {{ required "secret.secretKey is required; load values.encrypted.yaml" .Values.secret.secretKey | quote }}
  OIDC_CLIENT_ID: "securo"
  OIDC_CLIENT_SECRET: {{ required "secret.oidcClientSecret is required; load values.encrypted.yaml" .Values.secret.oidcClientSecret | quote }}
  ENABLE_BANKING_APP_ID: {{ .Values.secret.enableBankingAppId | default "" | quote }}
  ENABLE_BANKING_PRIVATE_KEY: {{ .Values.secret.enableBankingPrivateKey | default "" | quote }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://securo:%s@%s-database-rw:5432/securo" (.Values.secret.databasePassword | urlquery) .Release.Name | quote }}
