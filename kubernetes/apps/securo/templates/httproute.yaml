apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: internal
      namespace: traefik
  hostnames:
    - {{ .Values.securo.global.domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.securo.fullnameOverride }}-backend
          port: {{ .Values.securo.backend.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.securo.fullnameOverride }}-frontend
          port: {{ .Values.securo.frontend.service.port }}
