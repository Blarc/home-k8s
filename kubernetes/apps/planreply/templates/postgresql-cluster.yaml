apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  bootstrap:
    initdb:
      database: planreply
      owner: planreply
  storage:
    size: 5Gi
    storageClass: topolvm-thin-retain
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: false
