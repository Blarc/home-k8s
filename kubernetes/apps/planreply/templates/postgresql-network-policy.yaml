{{- if and .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgresql
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Application SQL connections; no access to the instance manager.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/controller: planreply
      ports:
        - protocol: TCP
          port: 5432
    # Operator reconciliation and instance management.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: operators
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
              app.kubernetes.io/instance: cloudnative-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    # Bootstrap, replication, and communication between database instances.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
---
# Cilium identifies the API server even when its endpoint is a node/VPN IP.
# This supplements the standard NetworkPolicy without allowing general HTTPS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgresql-api
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Release.Name }}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
{{- end }}
