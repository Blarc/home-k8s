title: |
  {{- if eq .status "firing" }}
  🚨 Alert: {{ (first .alerts).labels.alertname }}
  {{- else if eq .status "resolved" }}
  ✅ Resolved: {{ (first .alerts).labels.alertname }}
  {{- else }}
  {{ fail "Unsupported Alertmanager status." }}
  {{- end }}
message: |
  Status: {{ .status | title }}
  Receiver: {{ .receiver }}
  
  {{- range .alerts }}
  Alert: {{ .labels.alertname }}
  Instance: {{ .labels.instance }}
  Severity: {{ .labels.severity }}
  {{- if .labels.serial }}
  Disk serial: {{ .labels.serial }}
  {{- end }}
  Starts at: {{ .startsAt }}
  {{- if .endsAt }}Ends at: {{ .endsAt }}{{ end }}
  {{- if .annotations.summary }}
  Summary: {{ .annotations.summary }}
  {{- end }}
  {{- if .annotations.description }}
  Description: {{ .annotations.description }}
  {{- end }}
  Source: {{ .generatorURL }}
  
  {{ end }}
priority: |
  {{- $priority := 3 -}}
  {{- range .alerts -}}
    {{- if eq .labels.component "nas-disk-health" -}}
      {{- if eq $.status "resolved" -}}
        {{- $priority = 2 -}}
      {{- else if eq .labels.severity "critical" -}}
        {{- $priority = 5 -}}
      {{- else if and (eq .labels.severity "warning") (lt $priority 4) -}}
        {{- $priority = 4 -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{ $priority }}
