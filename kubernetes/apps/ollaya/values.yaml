app-template:
  controllers:
    ollaya:
      strategy: Recreate
      initContainers:
        pull-model:
          image:
            repository: ghcr.io/ollaya-dev/ollaya
            tag: 0.12.1
            pullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
          # language=bash
          args:
            - |
              ollaya serve &
              server_pid=$!
              trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

              until ollaya list >/dev/null 2>&1; do
                kill -0 "${server_pid}"
                sleep 1
              done

              # ollaya pull laya:multilingual
              # ollaya pull decima
              ollaya pull decima:small
          env:
            OLLAYA_HOST: 127.0.0.1:11435
            OLLAYA_MODELS: /home/ollaya/.ollaya/models
            OLLAYA_LOG: debug
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
      containers:
        app:
          image:
            repository: ghcr.io/ollaya-dev/ollaya
            tag: 0.12.1
            pullPolicy: IfNotPresent
          env:
            OLLAYA_HOST: 0.0.0.0:11435
            OLLAYA_MODELS: /home/ollaya/.ollaya/models
            OLLAYA_LOG: debug
            OLLAYA_KEEP_ALIVE: 30s
            OLLAYA_MAX_LOADED_MODELS: "1"
          ports:
            - name: http
              containerPort: &port 11435
              protocol: TCP
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: http
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 30
            liveness: &probe
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: http
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
            readiness: *probe
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi

  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

  service:
    app:
      controller: ollaya
      type: ClusterIP
      ports:
        http:
          port: *port
          targetPort: http

  route:
    app:
      hostnames:
        - "{{ .Release.Name }}.blarc.my.id"
      parentRefs:
        - name: internal
          namespace: traefik
      rules:
        - backendRefs:
            - identifier: app
              port: *port
          matches:
            - path:
                type: PathPrefix
                value: /

  persistence:
    data:
      type: persistentVolumeClaim
      storageClass: topolvm-thin
      accessMode: ReadWriteOnce
      size: 20Gi
      globalMounts:
        - path: /home/ollaya/.ollaya
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp
