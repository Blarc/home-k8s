app-template:
  controllers:
    zeroclaw:
      annotations:
        reloader.stakater.com/auto: "true"
      strategy: Recreate
      serviceAccount:
        identifier: zeroclaw
      initContainers:
        setup-config:
          image:
            repository: ghcr.io/zeroclaw-labs/zeroclaw
            tag: v0.8.5-debian@sha256:1876f4cfc85d1fd3f418e0607fc9207ef6525113e985092ac09b8dcd179df05e
          # Containers start concurrently; wait for MCP so ZeroClaw does not
          # permanently fail open without its tools after a startup race.
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /zeroclaw-data/.zeroclaw
              cp -f /config-source/config.toml /zeroclaw-data/.zeroclaw/config.toml
              chmod 0600 /zeroclaw-data/.zeroclaw/config.toml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        app:
          image:
            repository: ghcr.io/zeroclaw-labs/zeroclaw
            tag: v0.8.5-debian@sha256:1876f4cfc85d1fd3f418e0607fc9207ef6525113e985092ac09b8dcd179df05e
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:8080/healthz >/dev/null; do
                sleep 1
              done
              exec /usr/local/bin/zeroclaw --verbose --log-level info daemon
          envFrom:
            - secretRef:
                identifier: credentials
          ports:
            - name: gateway
              containerPort: &port 42617
              protocol: TCP
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: gateway
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: gateway
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: gateway
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 1
              memory: 512Mi
        kubernetes-mcp:
          image:
            repository: ghcr.io/containers/kubernetes-mcp-server
            tag: v0.0.66
          args:
            - --port
            - "8080"
            - --cluster-provider
            - in-cluster
            - --disable-multi-cluster
            - --read-only
            - --stateless
            - --toolsets
            - core,config
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: kubernetes.default.svc
            - name: KUBERNETES_SERVICE_PORT
              value: "443"
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: mcp
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: mcp
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: mcp
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

  serviceAccount:
    zeroclaw:
      forceRename: zeroclaw
      automountServiceAccountToken: false

  rbac:
    roles:
      zeroclaw-metrics:
        forceRename: zeroclaw-metrics
        type: ClusterRole
        rules:
          - apiGroups:
              - metrics.k8s.io
            resources:
              - nodes
              - pods
            verbs:
              - get
              - list
              - watch
    bindings:
      zeroclaw-view:
        forceRename: zeroclaw-view
        type: ClusterRoleBinding
        roleRef:
          name: view
          kind: ClusterRole
        subjects:
          - identifier: zeroclaw
      zeroclaw-metrics:
        forceRename: zeroclaw-metrics
        type: ClusterRoleBinding
        roleRef:
          identifier: zeroclaw-metrics
        subjects:
          - identifier: zeroclaw

  service:
    app:
      type: ClusterIP
      controller: zeroclaw
      ports:
        gateway:
          port: *port
          targetPort: gateway

  configMaps:
    config:
      includeInChecksum: true
      data:
        config.toml: |-
          schema_version = 3

          [providers.models.openrouter.default]
          model = "openrouter/free"

          [agents.default]
          channels = ["discord.default"]
          model_provider = "openrouter.default"
          risk_profile = "full"
          runtime_profile = "agentic"
          mcp_bundles = ["kubernetes"]

          [mcp]
          enabled = true
          deferred_loading = false

          [[mcp.servers]]
          name = "kubernetes"
          transport = "http"
          url = "http://127.0.0.1:8080/mcp"

          [mcp_bundles.kubernetes]
          servers = ["kubernetes"]

          [risk_profiles.full]
          level = "full"
          workspace_only = false

          [runtime_profiles.agentic]
          agentic = true

          [channels.discord.default]
          enabled = true
          guild_ids = ["1543883980649275482"]
          channel_ids = ["1543891133711781998"]
          mention_only = false
          archive = false

          [peer_groups.discord_default]
          channel = "discord.default"
          agents = ["default"]
          external_peers = ["221581663526846464"]

          [gateway]
          host = "[::]"
          port = 42617
          allow_public_bind = true
          require_pairing = true
          web_dist_dir = "/usr/share/zeroclawlabs/web/dist"

  secrets:
    credentials:
      includeInChecksum: true

  persistence:
    data:
      type: persistentVolumeClaim
      storageClass: topolvm-thin-retain
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        zeroclaw:
          setup-config:
            - path: /zeroclaw-data
          app:
            - path: /zeroclaw-data
    config-source:
      type: configMap
      identifier: config
      advancedMounts:
        zeroclaw:
          setup-config:
            - path: /config-source/config.toml
              subPath: config.toml
              readOnly: true
    tmp:
      type: emptyDir
      advancedMounts:
        zeroclaw:
          setup-config:
            - path: /tmp
          app:
            - path: /tmp
          kubernetes-mcp:
            - path: /tmp
    kubernetes-token:
      type: custom
      volumeSpec:
        projected:
          defaultMode: 0440
          sources:
            - serviceAccountToken:
                path: token
                expirationSeconds: 3600
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - downwardAPI:
                items:
                  - path: namespace
                    fieldRef:
                      fieldPath: metadata.namespace
      advancedMounts:
        zeroclaw:
          kubernetes-mcp:
            - path: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
