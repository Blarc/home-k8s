libraryPvc:
  size: 1Ti

immich:
  controllers:
    main:
      containers:
        main:
          image:
            # renovate: datasource=github-releases depName=immich-app/immich
            tag: v3.1.0
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: user
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: password
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: dbname

#  server:
#    controllers:
#      main:
#        replicas: 0

  immich:
    persistence:
      library:
        existingClaim: immich-data
    configuration:
      oauth:
        enabled: true
        autoRegister: true
        buttonText: "Sign in with Authelia"
        clientId: "hrQQXJ6Vf93NhcmSR1EpZ8Oa3PMala9t9fUY0cq8"
        issuerUrl: "https://auth.blarc.my.id"

  valkey:
    enabled: true
    controllers:
      main:
        containers:
          main:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      data:
        # Optional: Set this to persistentVolumeClaim to keep job queues persistent
        type: persistentVolumeClaim
        storageClass: topolvm-thin
        size: 1Gi
        accessMode: ReadWriteOnce

  machine-learning:
    controllers:
      main:
        containers:
          main:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    persistence:
      cache:
        # Optional: Set this to persistentVolumeClaim to avoid downloading the ML models every start.
        type: persistentVolumeClaim
        storageClass: topolvm-thin
        size: 10Gi
        accessMode: ReadWriteOnce

  server:
    controllers:
      main:
        containers:
          main:
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
