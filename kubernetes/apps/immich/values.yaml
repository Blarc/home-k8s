libraryPvc:
  size: 1Ti

immich:
  controllers:
    main:
      containers:
        main:
          image:
            # renovate: datasource=github-releases depName=immich-app/immich
            tag: v2.7.5
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: user
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: password
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: dbname
  immich:
    persistence:
      library:
        existingClaim: immich-data
    configuration:
      oauth:
        enabled: true
        autoRegister: true
        buttonText: "Sign in with Authelia"
        clientId: "hrQQXJ6Vf93NhcmSR1EpZ8Oa3PMala9t9fUY0cq8"
        issuerUrl: "https://auth.blarc.my.id"

  valkey:
    enabled: true
    persistence:
      data:
        # Optional: Set this to persistentVolumeClaim to keep job queues persistent
        type: persistentVolumeClaim
        storageClass: topolvm-thin
        size: 1Gi
        accessMode: ReadWriteOnce

  machine-learning:
    persistence:
      cache:
        # Optional: Set this to persistentVolumeClaim to avoid downloading the ML models every start.
        type: persistentVolumeClaim
        storageClass: topolvm-thin
        size: 10Gi
        accessMode: ReadWriteOnce
