apiVersion: v1
kind: Secret
metadata:
    name: paperless-ngx
    namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
    PAPERLESS_SECRET_KEY: "{{ .Values.secretKey }}"
    PAPERLESS_ADMIN_PASSWORD: "{{ .Values.adminPassword }}"
    PAPERLESS_SOCIALACCOUNT_PROVIDERS: |-
        {
          "openid_connect": {
            "APPS": [
              {
                "provider_id": "authelia",
                "name": "Authelia",
                "client_id": "{{ .Values.authelia.clientId }}",
                "secret": "{{ .Values.authelia.secret }}",
                "settings": {
                  "server_url": "https://auth.blarc.my.id/.well-known/openid-configuration"
                }
              }
            ],
            "OAUTH_PKCE_ENABLED": "True"
          }
        }
