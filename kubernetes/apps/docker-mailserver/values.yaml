docker-mailserver:
  fullnameOverride: docker-mailserver
  certificate: docker-mailserver-certificate
  configMaps:
    postfix-relaymap.cf:
      create: true
      path: postfix-relaymap.cf
      data: |
        @planreply.eu [mail.smtp2go.com]:2525
    dkim-signing.conf:
      create: true
      path: rspamd/override.d/dkim_signing.conf
      data: |
        enabled = true;
        sign_authenticated = true;
        sign_local = true;

        domain {
          blarc.my.id {
            selector = "mail";
            path = "/etc/rspamd/dkim/rsa-2048-mail-blarc.my.id.private.txt";
          }
          planreply.eu {
            selector = "mail";
            path = "/etc/rspamd/dkim/rsa-2048-mail-planreply.eu.private.txt";
          }
        }
  secrets:
    postfix-sasl-password.cf:
      name: postfix-sasl-password.cf
      # Set create: true and data in values.encrypted.yaml before deploying.
      create: false
      path: postfix-sasl-password.cf
  deployment:
    env:
      OVERRIDE_HOSTNAME: mail.blarc.my.id
      POSTFIX_MESSAGE_SIZE_LIMIT: "73400320" # 70 MiB total email size
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
        ephemeral-storage: 100Mi
      limits:
        cpu: 1
        memory: 1Gi
        ephemeral-storage: 500Mi
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      lbipam.cilium.io/ips: "192.168.1.225"
      external-dns.kubernetes.io/hostname: "mail.blarc.my.id"
      external-dns.kubernetes.io/target: "193.77.155.77"
