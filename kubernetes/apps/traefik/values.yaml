traefik:
  fullnameOverride: traefik
  providers:
    kubernetesCRD:
      enabled: true
    kubernetesIngress:
      enabled: false
    kubernetesGateway:
      enabled: true

  log:
    level: INFO
  accessLog:
    enabled: true

  experimental:
    plugins:
      bouncer:
        moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
        version: v1.7.0

  volumes:
    - name: crowdsec-bouncer-key
      mountPath: /etc/traefik/crowdsec
      type: secret
      secretName: crowdsec-bouncer-key

  ingressClass:
    enabled: false

  ports:
    web:
      port: 8000
      exposedPort: 80
      expose:
        default: true
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      port: 8443
      exposedPort: 443
      expose:
        default: true
    web-external:
      port: 9000
      exposedPort: 80
      expose:
        external: true
      http:
        redirections:
          entryPoint:
            to: websecure-external
            scheme: https
            permanent: true
    websecure-external:
      port: 9443
      exposedPort: 443
      expose:
        external: true

  # Gateways are defined as templates
  gateway:
    enabled: false

  service:
    annotations:
      lbipam.cilium.io/ips: "192.168.1.228"
    additionalServices:
      external:
        spec:
          type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.1.229"
