mail:
  domains:
    - blarc.my.id
    - planreply.eu
  hostname: mail.blarc.my.id
  imapPort: 993
  smtpPort: 465

app-template:
  controllers:
    snappymail:
      type: deployment
      replicas: 1
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      initContainers:
        configure-domains:
          image: &image
            repository: ghcr.io/the-djmaze/snappymail
            tag: v2.38.2
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /var/lib/snappymail/_data_/_default_/domains
              cp /domain-config/*.json /var/lib/snappymail/_data_/_default_/domains/
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [DAC_OVERRIDE, FOWNER]
      containers:
        app:
          image: *image
          env:
            TZ: Europe/Ljubljana
            SECURE_COOKIES: "true"
            UPLOAD_MAX_SIZE: 50M
            MEMORY_LIMIT: 256M
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8888
                periodSeconds: 5
                failureThreshold: 60
            liveness: &probe
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8888
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness: *probe
          # Upstream startup chowns data, changes configuration, and starts
          # nginx/php-fpm workers as www-data (82). It requires writable root.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
  defaultPodOptions:
    securityContext:
      fsGroup: 82
      fsGroupChangePolicy: OnRootMismatch
  service:
    app:
      controller: snappymail
      ports:
        http:
          port: &port 8888
  route:
    app:
      hostnames:
        - snappymail.blarc.my.id
      parentRefs:
        - name: internal
          namespace: traefik
      rules:
        - backendRefs:
            - identifier: app
              port: *port
          matches:
            - path:
                type: PathPrefix
                value: /
  persistence:
    data:
      type: persistentVolumeClaim
      storageClass: topolvm-thin-retain
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /var/lib/snappymail
    domain-config:
      type: configMap
      name: '{{ .Release.Name }}-domains'
      advancedMounts:
        snappymail:
          configure-domains:
            - path: /domain-config
              readOnly: true
