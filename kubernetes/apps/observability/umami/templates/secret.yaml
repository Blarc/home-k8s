apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  APP_SECRET: {{ required "secret.appSecret is required; load values.encrypted.yaml with helm-secrets" .Values.secret.appSecret | quote }}
  TWO_FACTOR_ENCRYPTION_KEY: {{ required "secret.twoFactorEncryptionKey is required; load values.encrypted.yaml with helm-secrets" .Values.secret.twoFactorEncryptionKey | quote }}
