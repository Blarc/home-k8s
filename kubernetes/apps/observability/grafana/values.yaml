grafana:
  fullnameOverride: grafana
  deploymentStrategy:
    type: Recreate
  admin:
    existingSecret: grafana-admin-secret
  env:
    GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
    GF_EXPLORE_ENABLED: true
    # GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: natel-discrete-panel,pr0ps-trackmap-panel,panodata-map-panel
    GF_SECURITY_ANGULAR_SUPPORT_ENABLED: true
    GF_SERVER_ROOT_URL: https://grafana.blarc.my.id
  grafana.ini:
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
      reporting_enabled: false
    auth.anonymous:
      enabled: true
      org_id: 1
      org_name: Main Org.
      org_role: Viewer
    news:
      news_feed_enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      deleteDatasources:
        - { name: Alertmanager, orgId: 1 }
        - { name: Loki, orgId: 1 }
        - { name: Prometheus, orgId: 1 }
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          uid: prometheus
          url: http://vmsingle-victoria-metrics.observability.svc.cluster.local.:8428
          isDefault: true
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          uid: victorialogs
          url: http://vlsingle-victoria-metrics.observability.svc.cluster.local.:9428
        - name: Alertmanager
          type: alertmanager
          access: proxy
          uid: Alertmanager
          url: http://vmalertmanager-victoria-metrics.observability.svc.cluster.local.:9093
          jsonData:
            implementation: prometheus
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  # Dashboards are downloaded by Grafana's init container and provisioned from
  # the path below. This keeps dashboard definitions in Git and avoids the
  # sidecar volume masking the init container output.
  dashboards:
    default:
      cert-manager:
        # renovate: depName="Cert-manager-Kubernetes"
        gnetId: 20842
        revision: 3
        datasource: Prometheus
      external-dns:
        # renovate: depName="External-dns"
        gnetId: 15038
        revision: 3
        datasource: Prometheus
      kubernetes-api-server:
        # renovate: depName="Kubernetes / System / API Server"
        gnetId: 15761
        revision: 21
        datasource: Prometheus
      kubernetes-coredns:
        # renovate: depName="Kubernetes / System / CoreDNS"
        gnetId: 15762
        revision: 22
        datasource: Prometheus
      kubernetes-global:
        # renovate: depName="Kubernetes / Views / Global"
        gnetId: 15757
        revision: 43
        datasource: Prometheus
      kubernetes-namespaces:
        # renovate: depName="Kubernetes / Views / Namespaces"
        gnetId: 15758
        revision: 46
        datasource: Prometheus
      kubernetes-nodes:
        # renovate: depName="Kubernetes / Views / Nodes"
        gnetId: 15759
        revision: 40
        datasource: Prometheus
      kubernetes-pods:
        # renovate: depName="Kubernetes / Views / Pods"
        gnetId: 15760
        revision: 39
        datasource: Prometheus
      kubernetes-volumes:
        # renovate: depName="K8s / Storage / Volumes / Cluster"
        gnetId: 11454
        revision: 14
        datasource: Prometheus
      node-exporter-full:
        # renovate: depName="Node Exporter Full"
        gnetId: 1860
        revision: 45
        datasource: Prometheus
      node-feature-discovery:
        url: https://raw.githubusercontent.com/kubernetes-sigs/node-feature-discovery/master/examples/grafana-dashboard.json
        datasource: Prometheus
      prometheus:
        # renovate: depName="Prometheus"
        gnetId: 19105
        revision: 9
        datasource: Prometheus
      nut-exporter:
        url: https://raw.githubusercontent.com/DRuggeri/nut_exporter/refs/heads/master/dashboard/dashboard.json
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
      cloudnative-pg:
        url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/refs/heads/main/charts/cluster/grafana-dashboard.json
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
      victoriametrics-single-node:
        url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/master/dashboards/victoriametrics.json
      victoriametrics-vmagent:
        url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/master/dashboards/vmagent.json
      victoriametrics-vmalert:
        url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/master/dashboards/vmalert.json
      victoriametrics-operator:
        url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/master/dashboards/operator.json
      victorialogs-single-node:
        url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/master/dashboards/victorialogs.json
      victorialogs-vlagent:
        url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/master/dashboards/vlagent.json
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 256Mi
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      provider:
        disableDelete: true
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      searchNamespace: ALL
      labelValue: ""
  plugins:
    - grafana-clock-panel
    - grafana-piechart-panel
    - grafana-worldmap-panel
    - natel-discrete-panel
    - pr0ps-trackmap-panel
    - vonage-status-panel
    - victoriametrics-logs-datasource
  route:
    main:
      enabled: true
      parentRefs:
        - name: internal
          namespace: traefik
      hostnames:
        - grafana.blarc.my.id
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      memory: 512Mi
  testFramework:
    enabled: false
