victoria-metrics-k8s-stack:
  argocdReleaseOverride: victoria-metrics-stack
  fullnameOverride: victoria-metrics
  victoria-metrics-operator:
    operator:
      disable_prometheus_converter: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  # Grafana is deployed as a separate observability application.
  grafana:
    enabled: false
  defaultDashboards:
    enabled: false
  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "7d"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      storage:
        storageClassName: topolvm-thin
        resources:
          requests:
            storage: 10Gi
    route:
      enabled: true
      parentRefs:
        - name: internal
          namespace: traefik
      hostnames:
        - "victoria-metrics.blarc.my.id"
  vmagent:
    enabled: true
    spec:
      externalLabels:
        cluster: home
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
  vlsingle:
    enabled: true
    spec:
      retentionPeriod: "3d"
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      storage:
        storageClassName: topolvm-thin
        resources:
          requests:
            storage: 10Gi
    route:
      enabled: true
      parentRefs:
        - name: internal
          namespace: traefik
      hostnames:
        - "victoria-logs.blarc.my.id"
  vlagent:
    enabled: true
    spec:
      k8sCollector:
        enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
  vmalert:
    enabled: true
  # The old kube-prometheus-stack workloads are being replaced by these dependencies.
  prometheus-node-exporter:
    enabled: true
    fullnameOverride: node-exporter
    service:
      labels:
        jobLabel: node-exporter
  kubelet:
    vmScrape:
      spec:
        relabelConfigs:
          - sourceLabels:
              - __meta_kubernetes_node_name
            targetLabel: node
          - sourceLabels:
              - __metrics_path__
            targetLabel: metrics_path
          - targetLabel: job
            replacement: kubelet
  kube-state-metrics:
    enabled: true
    fullnameOverride: kube-state-metrics
    metricLabelsAllowlist:
      - pods=[*]
      - deployments=[*]
      - persistentvolumeclaims=[*]
  # These control-plane endpoints are not exposed by this cluster's managed control plane.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  alertmanager:
    enabled: true
    spec:
      configSecret: alertmanager
      externalURL: https://alertmanager.blarc.my.id
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: topolvm-thin
            resources:
              requests:
                storage: 1Gi
    route:
      enabled: true
      parentRefs:
        - name: internal
          namespace: traefik
      hostnames:
        - alertmanager.blarc.my.id
  # -- Fetch dashboards and rules from upstream sources at deploy time.
  syncJob:
    enabled: true
  defaultRules:
    enabled: true
  extraRules:
    dockerhub-rules:
      groups:
        - name: dockerhub
          rules:
            - alert: DockerhubRateLimitRisk
              annotations:
                summary: Kubernetes cluster Dockerhub rate limit risk
              expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
              labels:
                severity: critical
              record: ""
    oom-rules:
      groups:
        - name: oom
          rules:
            - alert: OomKilled
              annotations:
                summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
              expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
              labels:
                severity: critical
              record: ""
