machine:
  kubelet:
    extraArgs:
      # Needed for Netbird agent.
      # https://kubernetes.io/docs/tasks/administer-cluster/sysctl-cluster/#enabling-unsafe-sysctls
      allowed-unsafe-sysctls: net.ipv4.conf.all.src_valid_mark
    extraMounts:
      - destination: /var/data
        type: bind
        source: /var/data
        options:
          - bind
          - rshared
          - rw
